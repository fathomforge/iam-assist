# GoReleaser v2 config for iam-assist.
# Docs: https://goreleaser.com
# Test locally with: goreleaser release --snapshot --clean

version: 2

project_name: iam-assist

before:
  hooks:
    - go mod tidy

builds:
  - id: iam-assist
    main: .
    binary: iam-assist
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows arm64 is a tiny user base and Go support lags on CI.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - configs/example.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Other"
      order: 999

release:
  github:
    owner: fathomforge
    name: iam-assist
  draft: false
  prerelease: auto
  header: |
    ## iam-assist {{.Tag}}

    Least-privilege GCP IAM policies from natural language, powered by your choice of LLM.

    See the [README](https://github.com/fathomforge/iam-assist#readme) for install and quickstart.
  footer: |
    ---
    **Full changelog**: https://github.com/fathomforge/iam-assist/compare/{{.PreviousTag}}...{{.Tag}}

# Homebrew cask, published to fathomforge/homebrew-tap on each release.
#
# This block is inert until BOTH of these exist:
#   1. the public repo github.com/fathomforge/homebrew-tap
#   2. a HOMEBREW_TAP_GITHUB_TOKEN repo secret (a PAT with `contents: write`
#      on the tap; the default GITHUB_TOKEN cannot push to another repo)
#
# With the token unset, skip_upload evaluates to true and GoReleaser writes the
# cask to dist/ without pushing, so a release never fails on a missing tap.
homebrew_casks:
  - name: iam-assist
    binaries:
      - iam-assist
    homepage: https://github.com/fathomforge/iam-assist
    description: "AI-powered least-privilege GCP IAM policy generator"
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    repository:
      owner: fathomforge
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    commit_author:
      name: goreleaser-bot
      email: bot@fathomforge.dev
    commit_msg_template: "chore(cask): iam-assist {{ .Tag }}"
